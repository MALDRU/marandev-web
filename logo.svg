<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark: dark square with M -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#131810"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(126,200,69,0.18)" stroke-width="1"/>
  <polyline
    points="14,52 14,14 32,36 50,14 50,52"
    fill="none"
    stroke="#7ec845"
    stroke-width="3.6"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Wordmark: "Maran" light + "dev" green -->
  <text
    x="76"
    y="43"
    font-family="Syne, 'Segoe UI', Arial, sans-serif"
    font-size="33"
    font-weight="700"
    fill="#e4ead8"
    letter-spacing="-0.4">Maran<tspan fill="#7ec845">dev</tspan></text>
</svg>
